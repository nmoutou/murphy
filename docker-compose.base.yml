# ──────────────────────────────────────────────────────────────────────────────
# Two profiles, one substrate.
#
#   --profile ingest   mongo + qdrant + neo4j + embedding-service
#                      What `data/` needs to run `kedro run`. No backend, no frontend.
#   --profile serve    all of the above, plus backend + frontend.
#
# The three databases carry NO profile: a service without one always starts. They are
# the shared substrate, and they are declared exactly ONCE — two declarations would
# mean two Mongos, and nothing would guarantee the backend reads the database the
# pipeline wrote.
#
# ⚠️ `docker compose down` WITHOUT a profile flag does not stop profiled services. It
# reports success and leaves them running. The npm scripts name both profiles; do the
# same if you call compose by hand.
#
# On the literal `mongo:27017` / `qdrant:6333` values in `backend.environment` below:
# the pipeline runs on the HOST, so `.env.dev` holds host-facing URLs (localhost) —
# the host is the party compose cannot override. Compose overrides the containers.
# See the header of `.env.example`.
# ──────────────────────────────────────────────────────────────────────────────

services:
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.16.3
    networks:
      - backend
    volumes:
      - qdrant_data:/qdrant/storage

  mongo:
    container_name: mongo
    image: mongo:8.2
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - backend
    volumes:
      - mongo_data:/data/db

  neo4j:
    container_name: neo4j
    image: neo4j:2025.09.0
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_apoc_export_file_enabled: ${NEO4J_apoc_export_file_enabled}
      NEO4J_apoc_import_file_enabled: ${NEO4J_apoc_import_file_enabled}
      NEO4J_apoc_import_file_use__neo4j__config: ${NEO4J_apoc_import_file_use__neo4j__config}
      NEO4J_PLUGINS: ${NEO4J_PLUGINS}
      # NEO4J_dbms_mode: CORE
      # NEO4J_server_config_strict_validation_enabled: false
    networks:
      - backend
    volumes:
      - neo4j_data:/data

  backend:
    container_name: backend
    profiles: ["serve"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - backend
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - LOG_LEVEL=${LOG_LEVEL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX}
      - STREAM_RATE_LIMIT_WINDOW_MS=${STREAM_RATE_LIMIT_WINDOW_MS}
      - STREAM_RATE_LIMIT_MAX=${STREAM_RATE_LIMIT_MAX}

      # ── Container-internal hostnames. LITERAL, not ${…} pass-throughs. ──────
      # `.env.dev` holds the HOST's view (localhost) because the pipeline runs on the
      # host and cannot be overridden. Compose can be — so compose is.
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      - QDRANT_URL=http://qdrant:6333
      # A BARE ORIGIN: the backend appends `/v1/embeddings` and `/health` itself.
      # ragcore wants a `/v1`-suffixed base instead (it appends `/embeddings`), which
      # is what `.env.dev` carries. Same name, two shapes — hence the override.
      - EMBEDDING_SERVICE_URL=http://embedding-service:80

      # ── Derived, never hand-typed: one source of truth, two consumer names. ──
      - MONGODB_DATABASE=${MONGODB_DATA_DB_NAME}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL}

      - MONGODB_COLLECTION=${MONGODB_COLLECTION}
      - MONGODB_TIMEOUT=${MONGODB_TIMEOUT}
      - EMBEDDING_SERVICE_TIMEOUT=${EMBEDDING_SERVICE_TIMEOUT}
      # ⚠️ The pipeline does NOT write here — it derives its collection from the
      # workflow-config hash. See the note in `.env.example`.
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - RETRIEVAL_MIN_SCORE=${RETRIEVAL_MIN_SCORE}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K}
      - LLM_API_ENDPOINT=${LLM_API_ENDPOINT}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT}
    depends_on:
      - mongo
      - qdrant
      - embedding-service

  frontend:
    container_name: frontend
    profiles: ["serve"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - backend
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding-service:
    container_name: embedding-service
    # Both profiles: the pipeline embeds with it, and so does the backend.
    profiles: ["ingest", "serve"]
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.8.1
    # ⚠️ `--model-id` is the ONLY model this service will ever serve. It ignores the
    # `model` field of incoming requests. The pipeline therefore checks GET /info
    # before writing anything — see assert_service_serves_model.
    command: ["--model-id", "${EMBEDDING_MODEL}", "--pooling", "mean", "--dtype", "float16"]
    networks:
      - backend
    volumes:
      - hf_cache:/data
    # No healthcheck: the TEI image ships no `curl`, so the stock check would report
    # `unhealthy` forever — and a future `condition: service_healthy` would deadlock on
    # it. Probe it from the host instead: `curl localhost:5001/health`.
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=0
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}

networks:
  backend:
    driver: bridge

volumes:
  mongo_data:
  neo4j_data:
  qdrant_data:
  hf_cache:
