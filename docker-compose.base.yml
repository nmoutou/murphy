services:
  opensearch:
    container_name: opensearch
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - search.insights.top_queries.latency.enabled=false
      - search.insights.top_queries.cpu.enabled=false
      - search.insights.top_queries.memory.enabled=false
      - search.insights.recommendations.enabled=false
    networks:
      - backend
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  mongo:
    container_name: mongo
    image: mongo:8.2
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - backend
    volumes:
      - mongo_data:/data/db

  neo4j:
    container_name: neo4j
    image: neo4j:2025.09.0
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_apoc_export_file_enabled: ${NEO4J_apoc_export_file_enabled}
      NEO4J_apoc_import_file_enabled: ${NEO4J_apoc_import_file_enabled}
      NEO4J_apoc_import_file_use__neo4j__config: ${NEO4J_apoc_import_file_use__neo4j__config}
      NEO4J_PLUGINS: ${NEO4J_PLUGINS}
    networks:
      - backend
    volumes:
      - neo4j_data:/data

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - backend
    # NODE_ENV vient de la cible de build, pas de .env.dev
    environment:
      - PORT=${PORT}
      - NODE_LOG_LEVEL=${NODE_LOG_LEVEL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX}
      - STREAM_RATE_LIMIT_WINDOW_MS=${STREAM_RATE_LIMIT_WINDOW_MS}
      - STREAM_RATE_LIMIT_MAX=${STREAM_RATE_LIMIT_MAX}
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_INDEX=${OPENSEARCH_INDEX}
      - OPENSEARCH_TIMEOUT=${OPENSEARCH_TIMEOUT}
      - EMBEDDING_SERVICE_URL=http://embedding-service:80
      - MONGODB_DATABASE=${MONGODB_DATA_DB_NAME}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL}
      - MONGODB_TIMEOUT=${MONGODB_TIMEOUT}
      - EMBEDDING_SERVICE_TIMEOUT=${EMBEDDING_SERVICE_TIMEOUT}
      - PAGINATION_SIZE=${PAGINATION_SIZE}
      - PAGINATION_DEPTH=${PAGINATION_DEPTH}
      - LLM_API_ENDPOINT=${LLM_API_ENDPOINT}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT}
    depends_on:
      - mongo
      - opensearch
      - embedding-service

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding-service:
    container_name: embedding-service
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.8.1
    command: ["--model-id", "${EMBEDDING_MODEL}", "--pooling", "mean", "--dtype", "float16"]
    networks:
      - backend
    volumes:
      - hf_cache:/data
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

networks:
  backend:
    driver: bridge

volumes:
  mongo_data:
  neo4j_data:
  opensearch_data:
  hf_cache:
