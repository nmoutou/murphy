[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
# StrEnum (core/models/enums.py) exige 3.11.
requires-python = ">=3.11"
name = "data"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Domaine — core/ ne connaît que pydantic, aucune base.
    "pydantic~=2.13",
    # Configuration — lue de l'environnement, jamais du dépôt.
    "pydantic-settings~=2.7",
    # Adaptateurs de stockage — un par base.
    "motor~=3.7",
    "pymongo~=4.10",
    "opensearch-py[async]~=3.2",
    "neo4j~=5.28",
    # Embedding distant (service compatible OpenAI / TEI).
    "httpx~=0.28",
    # Réduction transitive du graphe (core/services/relation_reduction) : du calcul pur
    # du domaine, comme `re`, donc ni port ni extra.
    "networkx~=3.4",
    # Orchestration.
    "kedro~=1.1.1",
    "omegaconf~=2.3",
    "python-dotenv~=1.2",
    "setuptools; python_version >= '3.12'"
]

[project.scripts]
"data" = "data.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
# Exploration interactive : jamais importé par ragcore.
notebooks = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro-viz>=6.7.0"
]
docs = [
    "docutils<0.21",
    "sphinx>=5.3,<7.3",
    "sphinx_rtd_theme==2.0.0",
    "nbsphinx==0.8.1",
    "sphinx-autodoc-typehints==1.20.2",
    "sphinx_copybutton==0.5.2",
    "ipykernel>=5.3, <7.0",
    "Jinja2<3.2.0",
    "myst-parser>=1.0,<2.1"
]
dev = [
    "pytest-cov>=3,<7",
    "pytest-mock>=1.7.1, <2.0",
    "pytest~=8.3",
    "pytest-asyncio~=0.25",
    "testcontainers[mongodb,neo4j,opensearch]~=4.9",
    "ruff~=0.12.0",
    "mypy~=1.14"
]

[tool.setuptools.dynamic]
version = {attr = "data.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"ragcore.adapters.storage.opensearch" = ["index_definition.json"]

[tool.kedro]
package_name = "data"
project_name = "data"
kedro_init_version = "1.1.1"
tools = "['Linting', 'Testing', 'Custom Logging', 'Documentation', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
# Sans ce mode, tout test `async def` est sauté en silence.
asyncio_mode = "auto"
markers = [
    "integration: exige des conteneurs (testcontainers) — exclu par défaut"
]
addopts = """
--cov-report term-missing \
--cov src/ragcore -ra \
-m 'not integration'"""

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "W",   # pycodestyle
    "E",   # pycodestyle
    "I",   # isort
    "UP",  # pyupgrade
    "PL",  # Pylint
    "T201", # Print Statement
    # `except Exception` sans relance : seules les frontières voulues l'assument, chacune
    # avec un `noqa: BLE001 — <raison>`.
    "BLE",  # flake8-blind-except
    "C901", # mccabe : complexité cyclomatique
]
ignore = ["E501"]  # ruff format gère la longueur des lignes

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# Règle du CLAUDE.md. Exceptions : les nœuds Kedro (ci-dessous) et les façades dont les
# paramètres nommés sont les champs qu'elles assemblent, chacune avec son `noqa`.
max-args = 4

[tool.ruff.lint.per-file-ignores]
# Dans un test, la valeur attendue se lit mieux en place.
"**/tests/**" = ["PLR2004"]
# La signature d'un nœud Kedro est sa liste d'inputs dans le DAG (`pipeline.py`) : un
# objet cacherait au DAG ce que le nœud consomme.
"**/orchestration/kedro/nodes/*.py" = ["PLR0913"]

[tool.mypy]
# Pas de `python_version` : forcer 3.11 casserait l'analyse des stubs tiers écrits en
# 3.12+ (numpy). Le plancher 3.11 vient de `requires-python`.
strict = true
plugins = ["pydantic.mypy"]
# Pas les tests : leurs mocks non typés, `strict` les rejette. Ils sont co-localisés,
# d'où un motif sur tout segment `tests/`.
files = ["src/ragcore"]
exclude = ["/tests/"]

[[tool.mypy.overrides]]
# Dépendances sans stubs publiés
module = [
    "kedro.*",
    "omegaconf.*",
    "neo4j.*",
    "networkx.*",
    "sentence_transformers.*",
    # numpy est tiré transitivement ; ses stubs 3.12 cassent l'analyse sous 3.11.
    "numpy.*",
]
ignore_missing_imports = true
follow_imports = "silent"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.kedro_telemetry]
project_id = "a28f45a08efc41b9a86b2737a54c5c34"
