# Capacités déclarées de la source LEGI.
#
# Aucun code ne charge encore ce fichier — mais un fichier déclaratif qui MENT est pire
# qu'un fichier absent : il devient la référence de qui ne lit pas le code. Ces valeurs
# décrivent ce que le lot 4 a réellement livré.

source_name: legi
display_name: "Légifrance / LEGI"
version: "2.0.0"

capabilities:
  fetch_all: true
  # Le connecteur HTTP PISTE (`fetch_one`) n'a jamais tourné en production, et sa coquille
  # archivée a été supprimée au lot 4. Ce qui existe lit des fichiers XML locaux.
  fetch_one: false
  incremental: true
  relations: true
  # Il n'existe AUCUNE balise <ELI> dans le corpus (vérifié : 0 sur 2564 fichiers).
  # L'identifiant est un <ID> — le nom du modèle `ELI` est historique.
  eli: false

# Ce que la source livre et que le domaine n'ingère pas : 1637 `versions.xml` sur 2564
# fichiers. Un ID nu, ni contenu ni relation. Le connecteur les écarte AVANT le parser et
# les COMPTE (`connector.skipped`) — écarter n'est pas taire.
export_artifacts:
  versions.xml: "un identifiant nu, sans contenu ni relation"

# Un document = un IDENTIFIANT, pas un fichier. `TEXTE_VERSION` (titre + métadonnées) et
# `TEXTELR` (structure) sont les deux facettes du MÊME texte — mêmes 98 identifiants. Un
# RawDocument par fichier ferait écraser le titre par la facette qui n'en a pas.
document_families:
  ARTICLE: {title_from: NUM, content: true}
  SECTION_TA: {title_from: TITRE_TA, content: false}
  TEXTE_VERSION: {title_from: TITRE, content: true, merged_with: TEXTELR}
  TEXTELR: {title_from: null, content: false, merged_with: TEXTE_VERSION}

targets:
  mongo: true
  neo4j: true
  qdrant: true

chunking:
  # La structure dit OÙ couper, la taille dit JUSQU'OÙ aller. Ce ne sont pas deux
  # stratégies concurrentes : un bloc structurel de 3000 caractères doit quand même être
  # découpé, sans quoi l'embedder le tronque en silence.
  strategy: structural_bounded_by_size

neo4j:
  id_field: identifier

relations:
  # Les 16 `typelien` du corpus sont traduits par `vocabulary.py` vers 6 verbes
  # sémantiques. Ce qui n'est pas dans la table est DÉCLARÉ (`RunStats.unknowns`), pas
  # jeté — c'est ainsi que le corpus enseigne son vocabulaire.
  types: [cites, modifies, abrogates, creates, contains, references]
  # L'orientation vient de l'attribut `sens` : un lien XML donne exactement UNE arête.
  oriented_by: sens
  # Seule la CONTENANCE est transitive par nature. Réduire une citation détruirait un
  # fait. La réduction a lieu à l'échelle du CORPUS (phase 2), jamais par document.
  reducible_types: [contains]
