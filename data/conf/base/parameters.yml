# ============================================================
# Découpe
# ============================================================

# Tailles en caractères. Changer une valeur invalide les vecteurs déjà écrits :
# réingérer tout le corpus.
chunking:
  size: 384
  overlap: 25

# ============================================================
# Embedding
# ============================================================

# Le modèle doit être celui que sert TEI (EMBEDDING_MODEL dans .env.dev) et que le
# backend interroge. En changer invalide les vecteurs déjà écrits.
embedding:
  model_name: "sentence-transformers/all-mpnet-base-v2"
  dimension: 768

embedding_runtime:
  enabled: true

# ============================================================
# Export
# ============================================================

exportation:
  # `true` retire du document les métadonnées des balises non configurées ; le signal
  # `tag.unconfigured` est émis dans les deux cas. Booléen obligatoire.
  # Hors ENVIRONMENT=dev, ignoré : les métadonnées sont toujours retirées.
  skip_unconfigured: false

  neo4j:
    include_path: true
    include_content: true
    # Le label d'un nœud, d'après les 8 lettres de son identifiant. Un préfixe absent
    # de la table reçoit `default`.
    labels:
      default: "Document"
      by_prefix:
        LEGIARTI: "Article"
        LEGITEXT: "Texte"
        LEGISCTA: "Section"

# ============================================================
# Maintenance
# ============================================================

maintenance:
  # Efface TOUTES les données de TOUTES les bases (sauf la base méta).
  # Hors ENVIRONMENT=dev, `true` arrête le run avant tout nœud.
  nuke_all: true
