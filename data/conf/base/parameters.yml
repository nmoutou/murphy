# ============================================================
# Découpe
# ============================================================

# Changer une valeur invalide les vecteurs déjà écrits : réingérer tout le corpus.
chunking:
  # Le plus grand qui tienne dans la fenêtre du modèle (mesuré, cf. configuration.md).
  max_chars: 384
  # Ne joue que dans un bloc plus long que `max_chars`, coupé en plein mot : 3 ou 4
  # mots, de quoi garder entier un mot coupé à la frontière, pas une phrase. Non mesuré.
  # Doit rester < `max_chars`.
  overlap_chars: 25

# ============================================================
# Graphe Neo4j — s'applique en dev comme en prod
# ============================================================

# Le label d'un nœud, d'après les 8 lettres de son identifiant. Un préfixe absent de la
# table reçoit `default`. Changer la table sans `nuke_all` laisse l'ancien label sur les
# nœuds déjà écrits.
node_labels:
  default: "Document"
  by_prefix:
    LEGIARTI: "Article"
    LEGITEXT: "Texte"
    LEGISCTA: "Section"

# ============================================================
# Dev — IGNORÉ hors ENVIRONMENT=dev
# ============================================================

# Hors dev, tout le bloc est remplacé par les valeurs sûres (rien n'est effacé,
# l'embedding est calculé, les métadonnées non configurées sont retirées, les nœuds
# Neo4j restent maigres) et un avertissement le signale au log. Les clés restent
# obligatoires et validées partout : une coquille arrête le run même en prod.
dev:
  # Efface TOUTES les données de TOUTES les bases (sauf la base méta) en tête de run.
  nuke_all: true

  # `false` : aucun vecteur calculé ni écrit (ADR-023) ; Mongo et Neo4j normaux.
  embedding_enabled: true

  # `true` retire du document les métadonnées des balises non configurées ; le signal
  # `tag.unconfigured` est émis dans les deux cas (ADR-022 §1).
  skip_unconfigured: false

  # Ce que les nœuds Neo4j portent en plus (ADR-022 §2) : chemins des fichiers XML
  # source, texte du document (`_text_content`).
  node_hydration:
    include_path: true
    include_content: true
