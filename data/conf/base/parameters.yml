# Commodités de développement, appliquées seulement si ENVIRONMENT=dev ; sinon le fichier
# est remplacé par des valeurs sûres, avec un avertissement (ADR-043). Les clés restent
# obligatoires et validées partout : une coquille arrête le run même en prod.
#
# La découpe vit dans `.env.dev`, à côté d'EMBEDDING_MODEL dont elle dépend.

# Efface toutes les données de toutes les bases, sauf la base méta, en tête de run.
nuke_all: true

# `false` : aucun vecteur calculé ni écrit (ADR-023) ; Mongo et Neo4j normaux. TEI
# doit quand même tourner : le modèle servi est vérifié au démarrage.
embedding_enabled: false

# `true` retire les métadonnées et les arêtes non configurées ; les signaux `tags` et
# `links` sont émis dans les deux cas (ADR-022, ADR-048).
skip_unconfigured: true

# Les chemins des fichiers XML source (`source_files`), dans Mongo et sur le nœud Neo4j.
# Repasser à `false` sans `nuke_all` laisse ceux déjà écrits : un document déjà ingéré
# n'est pas réécrit, et Neo4j n'efface aucune propriété.
include_path: true

# Le texte du document sur son nœud Neo4j (`_text_content`), en plus des métadonnées,
# toujours présentes en dev (ADR-022). Même remarque sans `nuke_all`.
include_content_neo4j: true
