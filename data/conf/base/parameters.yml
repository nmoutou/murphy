# ============================================================
# GENERAL SETTINGS
# ============================================================

nlp:
  spacy_model: "fr_core_news_sm"


# ============================================================
# Phase 1: Importation
# ============================================================

importation:
  extraction:
    content_tag: "CONTENU"

  validation:
    validation_rules:
      require_eli: true
      format_regex: "^[A-Z]{8}[0-9]{12}$"
    log_invalidated: false

  normalization:
    title_mapping:
      enabled: true
      sources:
        Article:
          - "article_meta_meta_spec_meta_article_num"
        Texte:
          - "texte_version_meta_meta_spec_meta_texte_version_titre"
        TexteAdmin:
          - "section_ta_titre_ta"

# ============================================================
# Phase 2: Preparation
# ============================================================

field_mappings:
  Article:
    document_type: document
    r"^.*_ancien_id$": anciend_id
    r"^.*_eli$": eli
    r"^.*_etat$": etat
    r"^.*_num$": num
    r"^.*_type$": type
    r"^.*_nature$": nature
    r"^.*_origine$": origine
    r"^.*_date_debut$": date_debut
    r"^.*_date_fin$": date_fin
    r"^.*_url$": url
  
  Texte:
    document_type: document
    r"^.*_ancien_id$": anciend_id
    r"^.*_eli$": eli
    r"^.*_titre$": titre
    r"^.*_etat$": etat
    r"^.*_num$": num
    r"^.*_nature$": nature
    r"^.*_origine$": origine
    r"^.*_date_debut$": date_debut
    r"^.*_date_fin$": date_fin
    r"^.*_url$": url
    r"^.*_chronicle_cid$": chronicle_cid
    r"^.*_date_publi$": date_publi
    r"^.*_date_texte$": date_texte
    r"^.*_derniere_modification$": derniere_modification
    r"^.*_nor$": nor
    r"^.*_num_parution$": num_parution
    r"^.*_num_sequence$": num_sequence
    r"^.*_origine_publi$": origine_publi
    r"^.*_page_deb_publi$": page_deb_publi
    r"^.*_page_fin_publi$": page_fin_publi
    r"^.*_titrefull$": titre_full
    r"^.*_version_a_venir.*$": version_a_venir

  
  TexteAdmin:
    document_type: document
    section_ta_titre_ta: titre
    r"^.*_eli$": eli

  
# ============================================================
# Phase 3: Formatting
# ============================================================

formatting:
  tokenizing:
    tokenizing_model: ${nlp.spacy_model}
    batch_size: 50

  # --- Ce qui suit peuple le WorkflowConfig, donc ENTRE DANS LE HASH (§6) -----------
  # Changer une de ces valeurs crée mécaniquement une NOUVELLE collection Qdrant : les
  # vecteurs d'avant et d'après ne sont pas comparables, ils ne doivent pas cohabiter.
  # Les deux collections coexistent et restent rejouables — c'est le point de l'A/B.

  normalization:
    # §4 est ÉCRITE (sources/generic/normalize.py) : NFC, espaces insécables, caractères
    # de largeur nulle, césures conditionnelles. Pas de lemmatisation — on normalise la
    # typographie, jamais la langue.
    #
    # Ce passage de `none` à `v1` CHANGE LE HASH, donc la collection Qdrant — et c'est
    # exactement le comportement voulu : le texte embarqué n'est plus le même, les
    # vecteurs d'avant et d'après ne sont pas comparables et ne doivent pas cohabiter.
    # Les deux collections coexistent, chacune rejouable. C'est le premier vrai exercice
    # de l'A/B que le fingerprint rend possible.
    #
    # Doit rester synchronisé avec `NORMALIZATION_VERSION` dans le code : changer le
    # traitement sans changer cette version mélangerait deux jeux de vecteurs
    # incomparables DANS LA MÊME collection, sans que rien ne le signale.
    version: v1

  chunking:
    # ⚠️ chunk_size est en CARACTÈRES, la fenêtre du modèle en TOKENS. Le ratio n'est pas
    # constant : mesuré sur ce corpus, 3,08 car/token en moyenne mais **0,33 au pire**
    # (chunks de sigles et de ponctuation). 384 est le plus grand qui tienne : mesuré au
    # tokenizer du modèle sur les six sources, il produit 300 tokens au maximum — sous la
    # fenêtre de 384 — et **zéro document perdu**. 512 en perdait 1, 1024 en perdait 98.
    #
    # C'est aussi le bon compromis de coût : l'embedding est 99,9 % du temps d'un run, et
    # passer de 128 à 384 l'a divisé par ~5 (838 s → 173 s) en supprimant 44 000 chunks
    # inutiles. Au-delà de 384 on ne gagne presque plus rien (le GPU travaille au token,
    # pas au chunk) — on ne fait que perdre des documents.
    strategy: legi-structural-v1
    chunk_size: 384
    chunk_overlap: 25

  relations:
    filtering: []
    invert: 
      - txt_source
      - lien_art
      - lien_section_ta
    mappings:
      titre_tm: titre
      titre_txt: titre
      texte: titre
      lien_art: titre
      lien_section_ta: titre
      txt_source: source
    reduction:
      enabled: true
      types: 
        - titre

# ============================================================
# Phase 4: Exportation
# ============================================================

embedding:
  embedding:
    # Modèle + dimension : ils décident des vecteurs, donc ils SONT HASHÉS (§6).
    # Le *provider* (local / openai / noop), lui, est de l'infra et vit dans .env :
    # deux façons d'atteindre le même modèle produisent les mêmes vecteurs.
    embedding_model: "sentence-transformers/all-mpnet-base-v2"
    dimension: 768
    embedding_service_timeout: 30
    batch_size: 32

exportation:
  neo4j:
    include_path: false
    include_content: false

  mongodb:
    include_path: true
    database: "LEGIFRANCE"
    collection: "chunks"

  qdrant:
    # PAS de `collection:` — elle est DÉRIVÉE de l'empreinte du WorkflowConfig (§6),
    # jamais écrite à la main. La nommer ici permettrait d'écraser les vecteurs d'une
    # stratégie avec ceux d'une autre sans que rien ne le signale.
    distance: "Cosine"
    batch_size: 100


# ============================================================
# Phase 5: Maintenance
# ============================================================

maintenance:
  cleanup_enabled: true
  cache_paths:
    - "data/cache"
    - "data/meta/events"

  # `nuke_all` efface TOUTES les données de TOUTES les bases (Mongo documents+manifest,
  # graphe Neo4j, TOUTES les collections Qdrant) en tête de run — la base méta
  # MURPHY_META est PRÉSERVÉE. C'est le levier disque du développement : les données
  # sont jetables en v0. Le node `nukeAll` REFUSE de tourner si ENVIRONMENT != "dev"
  # (garde-fou : absence de ENVIRONMENT ⇒ prod ⇒ refus). À NE PAS activer en prod.
  nuke_all: true