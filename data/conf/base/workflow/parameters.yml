# ============================================================
# Bloc W — WorkflowConfig hashé (ADR-026)
# ============================================================
#
# Tout ce qui suit peuple le WorkflowConfig, donc ENTRE DANS LE HASH (§6 du cliquet
# `golden/test_fingerprint.py`). Changer une de ces valeurs crée mécaniquement une
# NOUVELLE collection Qdrant : les vecteurs d'avant et d'après ne sont pas comparables,
# ils ne doivent pas cohabiter. Les deux collections coexistent et restent rejouables —
# c'est le point de l'A/B.
#
# Règle invariante (ADR-026) : ce fichier ne contient QUE du hashé. Aucune URI, secret,
# chemin ou paramètre d'infra n'y a sa place — ceux-là vivent dans `conf/base/ingestion/`.

workflow:
  normalization:
    # §4 est ÉCRITE (sources/generic/normalize.py) : NFC, espaces insécables, caractères
    # de largeur nulle, césures conditionnelles. Pas de lemmatisation — on normalise la
    # typographie, jamais la langue.
    #
    # Ce passage de `none` à `v1` CHANGE LE HASH, donc la collection Qdrant — et c'est
    # exactement le comportement voulu : le texte embarqué n'est plus le même, les
    # vecteurs d'avant et d'après ne sont pas comparables et ne doivent pas cohabiter.
    # Les deux collections coexistent, chacune rejouable. C'est le premier vrai exercice
    # de l'A/B que le fingerprint rend possible.
    #
    # Doit rester synchronisé avec `NORMALIZATION_VERSION` dans le code : changer le
    # traitement sans changer cette version mélangerait deux jeux de vecteurs
    # incomparables DANS LA MÊME collection, sans que rien ne le signale.
    version: v1

  chunking:
    # ⚠️ chunk_size est en CARACTÈRES, la fenêtre du modèle en TOKENS. Le ratio n'est pas
    # constant : mesuré sur ce corpus, 3,08 car/token en moyenne mais **0,33 au pire**
    # (chunks de sigles et de ponctuation). 384 est le plus grand qui tienne : mesuré au
    # tokenizer du modèle sur les six sources, il produit 300 tokens au maximum — sous la
    # fenêtre de 384 — et **zéro document perdu**. 512 en perdait 1, 1024 en perdait 98.
    #
    # C'est aussi le bon compromis de coût : l'embedding est 99,9 % du temps d'un run, et
    # passer de 128 à 384 l'a divisé par ~5 (838 s → 173 s) en supprimant 44 000 chunks
    # inutiles. Au-delà de 384 on ne gagne presque plus rien (le GPU travaille au token,
    # pas au chunk) — on ne fait que perdre des documents.
    strategy: legi-structural-v1
    chunk_size: 384
    chunk_overlap: 25

  embedding:
    # Modèle + dimension : ils décident des vecteurs, donc ils SONT HASHÉS (§6).
    # Le *provider* (local / openai / noop), lui, est de l'infra et vit dans .env :
    # deux façons d'atteindre le même modèle produisent les mêmes vecteurs.
    #
    # ⚠️ Ce bloc ne contient QUE modèle + dimension. Timeout, batch_size et
    # l'interrupteur `enabled` (ADR-023) sont de l'infra : ils vivent dans
    # `conf/base/ingestion/parameters.yml` sous `embedding_runtime`, hors du hash.
    embedding_model: "sentence-transformers/all-mpnet-base-v2"
    dimension: 768
