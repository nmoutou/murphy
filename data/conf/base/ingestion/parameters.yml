# ============================================================
# PARAMÈTRE GÉNÉRAUX
# ============================================================

nlp:
  spacy_model: "fr_core_news_sm"


# ============================================================
# Phase 1: Importation
# ============================================================

importation:
  extraction:
    content_tag: "CONTENU"

  normalization:
    title_mapping:
      enabled: true
      sources:
        Article:
          - "article_meta_meta_spec_meta_article_num"
        Texte:
          - "texte_version_meta_meta_spec_meta_texte_version_titre"
        TexteAdmin:
          - "section_ta_titre_ta"

# ============================================================
# Phase 3: Formatage
# ============================================================

formatting:
  tokenizing:
    tokenizing_model: ${nlp.spacy_model}
    batch_size: 50

  relations:
    filtering: []
    invert:
      - txt_source
      - lien_art
      - lien_section_ta
    mappings:
      titre_tm: titre
      titre_txt: titre
      texte: titre
      lien_art: titre
      lien_section_ta: titre
      txt_source: source
    reduction:
      enabled: true
      types:
        - titre

# ============================================================
# Phase 3 bis: Découpe
# ============================================================

# Tailles en caractères. Changer une valeur invalide les vecteurs déjà écrits :
# réingérer tout le corpus.
chunking:
  size: 384
  overlap: 25

# ============================================================
# Phase 4: Export - embedding
# ============================================================

# Le modèle doit être celui que sert TEI (EMBEDDING_MODEL dans .env.dev) et que le
# backend interroge. En changer invalide les vecteurs déjà écrits.
embedding:
  model_name: "sentence-transformers/all-mpnet-base-v2"
  dimension: 768

embedding_runtime:
  embedding_service_timeout: 30
  batch_size: 32
  enabled: true

exportation:
  # `true` retire du document les métadonnées des balises non configurées ; le signal
  # `tag.unconfigured` est émis dans les deux cas. Booléen obligatoire.
  skip_unconfigured: false

  neo4j:
    include_path: true
    include_content: true
    # Le label d'un nœud, d'après les 8 lettres de son identifiant. Un préfixe absent
    # de la table reçoit `default`.
    labels:
      default: "Document"
      by_prefix:
        LEGIARTI: "Article"
        LEGITEXT: "Texte"
        LEGISCTA: "Section"

  mongodb:
    database: "LEGIFRANCE"
    collection: "chunks"

  qdrant:
    distance: "Cosine"
    batch_size: 100


# ============================================================
# Phase 5: Maintenance
# ============================================================

maintenance:
  cleanup_enabled: true
  cache_paths:
    - "data/cache"
    - "data/meta/events"

  # Efface TOUTES les données de TOUTES les bases (sauf la base méta).
  # Hors ENVIRONMENT=dev, `true` arrête le run avant tout nœud.
  nuke_all: true
