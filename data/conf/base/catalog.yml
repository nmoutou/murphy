# ============================================================
# Objets runtime — injectés par TelemetryHooks.before_pipeline_run
# ============================================================
# Ce ne sont pas des données mais des objets vivants (dépôts, fabriques, services)
# que le hook construit et pose au catalogue avant le run. Le DAG les NOMME, le hook
# les FOURNIT. Tout est `MemoryDataset` / `copy_mode: assign` : on passe la référence,
# jamais une copie — un client Mongo copié n'aurait plus de sens.

# --- Composants source (lus par les nœuds de maintenance) ---
connector:
  type: MemoryDataset
  copy_mode: assign

parser:
  type: MemoryDataset
  copy_mode: assign

# --- Dépôts du hook (maintenance + phase 2 ; les workers fabriquent les leurs) ---
doc_repo:
  type: MemoryDataset
  copy_mode: assign

graph_repo:
  type: MemoryDataset
  copy_mode: assign

vector_repo:
  type: MemoryDataset
  copy_mode: assign

# Les collisions du run (MURPHY_META.collisions), réécrites par `parseDocuments` (ADR-049).
collision_repo:
  type: MemoryDataset
  copy_mode: assign

# --- Le pool phase 1 et le service phase 2 ---
runner:
  type: MemoryDataset
  copy_mode: assign

resolve_service:
  type: MemoryDataset
  copy_mode: assign

# --- Contexte, télémétrie, runtime du hook (pont sync→async des nœuds non parallélisés) ---
pipeline_context:
  type: MemoryDataset
  copy_mode: assign

telemetry:
  type: MemoryDataset
  copy_mode: assign

# L'agrégateur du run, vu par le node `report` comme un simple `RunStatsSink`.
# `copy_mode: assign` n'est pas cosmétique : sans lui Kedro COPIERAIT l'agrégateur, et le
# node pousserait les stats des workers dans un clone que personne ne finalise.
run_stats_sink:
  type: MemoryDataset
  copy_mode: assign

pipeline_runtime:
  type: MemoryDataset
  copy_mode: assign

# --- Réglages du plan, validés par `plan_run` avant tout nœud ---
skip_unconfigured:
  type: MemoryDataset

nuke_all:
  type: MemoryDataset

# ============================================================
# Données inter-nœuds — produites et consommées dans le run
# ============================================================

nuke_done:
  type: MemoryDataset
  copy_mode: assign

raw_documents:
  type: MemoryDataset
  copy_mode: assign

to_process:
  type: MemoryDataset
  copy_mode: assign

to_skip:
  type: MemoryDataset
  copy_mode: assign

ingestion_outcome:
  type: MemoryDataset
  copy_mode: assign

resolution_outcome:
  type: MemoryDataset
  copy_mode: assign

run_report:
  type: MemoryDataset
  copy_mode: assign
