# ============================================================
# Objets vivants — posés au catalogue par TelemetryHooks.before_pipeline_run
# ============================================================
# Le DAG les nomme, le hook les fournit. `copy_mode: assign` passe la référence, jamais
# une copie : un client Mongo copié n'a plus de sens.

# --- Composants source (lus par les nœuds de maintenance) ---
connector:
  type: MemoryDataset
  copy_mode: assign

parser:
  type: MemoryDataset
  copy_mode: assign

# --- Dépôts du hook (maintenance + phase 2 ; les workers fabriquent les leurs) ---
doc_repo:
  type: MemoryDataset
  copy_mode: assign

graph_repo:
  type: MemoryDataset
  copy_mode: assign

vector_repo:
  type: MemoryDataset
  copy_mode: assign

# --- Le pool phase 1 et le service phase 2 ---
runner:
  type: MemoryDataset
  copy_mode: assign

resolve_service:
  type: MemoryDataset
  copy_mode: assign

# --- Contexte, télémétrie, runtime du hook (pont sync→async des nœuds non parallélisés) ---
pipeline_context:
  type: MemoryDataset
  copy_mode: assign

telemetry:
  type: MemoryDataset
  copy_mode: assign

# L'agrégateur du run. Sans `copy_mode: assign`, Kedro le copierait et `report`
# pousserait les stats des workers dans un clone que personne ne finalise.
run_stats_sink:
  type: MemoryDataset
  copy_mode: assign

pipeline_runtime:
  type: MemoryDataset
  copy_mode: assign

# --- Réglages du plan, validés par `plan_run` avant tout nœud ---
skip_unconfigured:
  type: MemoryDataset

nuke_all:
  type: MemoryDataset

# ============================================================
# Données inter-nœuds — produites et consommées dans le run
# ============================================================

nuke_done:
  type: MemoryDataset
  copy_mode: assign

raw_documents:
  type: MemoryDataset
  copy_mode: assign

to_process:
  type: MemoryDataset
  copy_mode: assign

to_skip:
  type: MemoryDataset
  copy_mode: assign

ingestion_outcome:
  type: MemoryDataset
  copy_mode: assign

resolution_outcome:
  type: MemoryDataset
  copy_mode: assign

run_report:
  type: MemoryDataset
  copy_mode: assign
