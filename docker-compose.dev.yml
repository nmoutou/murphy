services:
  qdrant:
    ports:
      - "6333:6333"
    restart: "no"

  mongo:
    ports:
      - "27017:27017"
    restart: "no"

  neo4j:
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: "no"

  backend:
    build:
      target: development
    volumes:
      - ./backend:/app:cached
      - backend_node_modules:/app/node_modules
    command: npm run dev:watch
    ports:
      - "5000:5000"
    restart: "no"

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules
    command: npm run dev
    ports:
      - "3000:3000"
    restart: "no"

  embedding-service:
    ports:
      - "5001:80"
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

volumes:
  backend_node_modules:
  frontend_node_modules:
