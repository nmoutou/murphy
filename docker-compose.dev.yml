services:
  qdrant:
    ports:
      - "6333:6333"
    restart: "no"

  mongo:
    ports:
      - "27017:27017"
    restart: "no"

  neo4j:
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: "no"

  backend:
    build:
      target: development
    # Sources only: dependencies live in the image, and no root-owned node_modules
    # appears on the host
    volumes:
      - ./backend/src:/app/backend/src:cached
    command: npm run dev:watch
    ports:
      - "5000:5000"
    restart: "no"

  frontend:
    build:
      target: development
    # `next dev` reads it at startup; production inlines it at build time instead
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    volumes:
      - ./frontend/src:/app/frontend/src:cached
      - ./frontend/public:/app/frontend/public:cached
    command: npm run dev
    ports:
      - "3000:3000"
    restart: "no"

  embedding-service:
    ports:
      - "5001:80"
    restart: "no"
