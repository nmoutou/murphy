services:
  opensearch:
    environment:
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    restart: "no"

  # Dev seulement : ouvert sans authentification
  opensearch-dashboards:
    container_name: opensearch-dashboards
    image: opensearchproject/opensearch-dashboards:3.9.0
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - backend
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    restart: "no"

  mongo:
    ports:
      - "27017:27017"
    restart: "no"

  neo4j:
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: "no"

  backend:
    build:
      target: development
    # Les sources seulement : les dépendances vivent dans l'image, et aucun
    # node_modules appartenant à root n'apparaît sur l'hôte
    volumes:
      - ./backend/src:/app/backend/src:cached
    command: npm run dev:watch
    ports:
      - "5000:5000"
    restart: "no"

  frontend:
    build:
      target: development
    # Lu au démarrage par `next dev` ; la production l'inline au build
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    volumes:
      - ./frontend/src:/app/frontend/src:cached
      - ./frontend/public:/app/frontend/public:cached
    command: npm run dev
    ports:
      - "3000:3000"
    restart: "no"

  embedding-service:
    ports:
      - "5001:80"
    restart: "no"
