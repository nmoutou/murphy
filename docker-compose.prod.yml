services:
  qdrant:
    restart: always

  mongo:
    restart: always

  neo4j:
    restart: always

  backend:
    build:
      target: production
    restart: on-failure
    command: npm start

  frontend:
    build:
      target: production
    ports:
      - "3000:3000"
    restart: on-failure
    command: npm start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  embedding-service:
    restart: on-failure
    mem_limit: 2g
    ports:
      - "5001:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
