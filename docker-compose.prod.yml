services:
  qdrant:
    restart: always

  opensearch:
    restart: always

  mongo:
    restart: always

  neo4j:
    restart: always

  backend:
    build:
      target: production
    # Pas de reverse proxy : le navigateur appelle le backend directement.
    # CORS_ORIGIN doit être l'origine publique du frontend.
    ports:
      - "5000:5000"
    restart: on-failure
    command: npm start

  frontend:
    build:
      target: production
      # Inliné par `next build` : l'URL du backend vue par le navigateur
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    restart: on-failure
    command: npm start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  embedding-service:
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
