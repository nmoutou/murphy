name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  typescript:
    name: TypeScript (contract, backend, frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Same major as the Docker images
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # The root postinstall builds packages/contract
      - name: Install dependencies
        run: npm ci

      # Contract build, backend type-check + lint + tests, frontend type-check + lint + format + build.
      - name: Check
        run: npm run check

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: typescript
    strategy:
      matrix:
        app: [ backend, frontend ]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Extract commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # The context is the repository root: the apps share the root lockfile and the contract
      - name: Build Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./${{ matrix.app }}/Dockerfile
          target: production
          push: false
          load: true
          tags: |
            ${{ matrix.app }}:latest
            ${{ matrix.app }}:${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
