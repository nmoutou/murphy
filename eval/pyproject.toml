[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11"
name = "murphy-eval"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Domaine — les modèles ne connaissent que pydantic, comme ragcore/core.
    "pydantic~=2.13",
    # Ossature des métriques sans coupe (MAP, Doc-MRR) et futur test apparié (B-10) :
    # nDCG@R et les diagnostics à coupe adaptative restent maison (ADR-027).
    "ranx~=0.3",
    # Poids positionnel du DCG (log2) et agrégats numériques.
    "numpy~=2.0",
    # Adapter baseline (B-05) : chemin de lecture Qdrant/TEI/Mongo dédié, sans
    # importer ragcore (ADR-027). httpx pour TEI, pymongo pour le pointeur de
    # collection, pydantic-settings pour lire le .env.dev racine.
    "qdrant-client~=1.12",
    "httpx~=0.28",
    "pymongo~=4.9",
    # Socle d'extraction des paires de co-citation (B-07) : chemin de lecture
    # Neo4j dédié, lecture seule, sans importer ragcore (ADR-027).
    "neo4j~=5.26",
    "pydantic-settings~=2.7",
]

[project.scripts]
# Le socle de co-citation (B-07) : produit le jeu de paires versionné + sa
# volumétrie (E-P2-05), et sert de procédure de rejeu (E-T-02).
murphy-eval-cocitation = "murphy_eval.cli.cocitation:main"

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-cov>=3,<7",
    "ruff~=0.12.0",
    "mypy~=1.14",
    # Test d'intégration B-05 : Qdrant éphémère (marker `integration`, hors CI).
    "testcontainers~=4.9",
    # Oracle SECONDAIRE (cross-check du nDCG@R maison) — jamais importé par le
    # code de production, seulement par tests/oracle/. ADR-028 : le scorer est
    # vérifié par des cas jouets calculés à la main, pas par un oracle externe ;
    # trec_eval ne fait ici que déplacer le risque en second témoin.
    "pytrec_eval-terrier",
]

[tool.setuptools.dynamic]
version = { attr = "murphy_eval.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "oracle: cross-check contre trec_eval/pytrec_eval — hors CI par défaut",
    "integration: nécessite des conteneurs (Qdrant, Neo4j) — hors CI par défaut",
]
addopts = """
--cov-report term-missing \
--cov src/murphy_eval -ra \
-m 'not oracle and not integration'"""

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "W",    # pycodestyle
    "E",    # pycodestyle
    "I",    # isort
    "UP",   # pyupgrade
    "PL",   # Pylint
    "T201", # Print Statement
]
ignore = ["E501"] # Ruff format takes care of line-too-long

[tool.ruff.lint.per-file-ignores]
# Dans un test, la valeur attendue EST le propos de l'assertion (idem data/).
"**/tests/**" = ["PLR2004"]
# Une CLI parle à l'opérateur : `print` y est le moyen, pas un oubli de debug.
"**/cli/**" = ["T201"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/murphy_eval"]
exclude = ["/tests/"]

[[tool.mypy.overrides]]
module = ["ranx.*", "numpy.*", "pytrec_eval.*", "qdrant_client.*", "testcontainers.*", "neo4j.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
