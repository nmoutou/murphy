[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11"
name = "murphy-eval"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Domaine — les modèles ne connaissent que pydantic, comme ragcore/core.
    "pydantic~=2.13",
    # Ossature des métriques sans coupe (MAP, Doc-MRR) et futur test apparié (B-10) :
    # nDCG@R et les diagnostics à coupe adaptative restent maison (ADR-027).
    "ranx~=0.3",
    # Poids positionnel du DCG (log2) et agrégats numériques.
    "numpy~=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-cov>=3,<7",
    "ruff~=0.12.0",
    "mypy~=1.14",
    # Oracle SECONDAIRE (cross-check du nDCG@R maison) — jamais importé par le
    # code de production, seulement par tests/oracle/. ADR-028 : le scorer est
    # vérifié par des cas jouets calculés à la main, pas par un oracle externe ;
    # trec_eval ne fait ici que déplacer le risque en second témoin.
    "pytrec_eval-terrier",
]

[tool.setuptools.dynamic]
version = { attr = "murphy_eval.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "oracle: cross-check contre trec_eval/pytrec_eval — hors CI par défaut",
]
addopts = """
--cov-report term-missing \
--cov src/murphy_eval -ra \
-m 'not oracle'"""

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "W",    # pycodestyle
    "E",    # pycodestyle
    "I",    # isort
    "UP",   # pyupgrade
    "PL",   # Pylint
    "T201", # Print Statement
]
ignore = ["E501"] # Ruff format takes care of line-too-long

[tool.ruff.lint.per-file-ignores]
# Dans un test, la valeur attendue EST le propos de l'assertion (idem data/).
"**/tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/murphy_eval"]
exclude = ["/tests/"]

[[tool.mypy.overrides]]
module = ["ranx.*", "numpy.*", "pytrec_eval.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
